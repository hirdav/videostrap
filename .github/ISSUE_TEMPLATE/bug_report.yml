name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a .mkv file
        2. Choose "Total N frames" = 10
        3. Click Extract
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Extraction engine
      options:
        - ffmpeg
        - opencv
        - Not sure
    validations:
      required: true
  - type: input
    id: video-format
    attributes:
      label: Video format/codec (if relevant)
      placeholder: e.g. MP4/H.264, MOV/HEVC
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.11.4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant terminal output / logs
      render: shell
